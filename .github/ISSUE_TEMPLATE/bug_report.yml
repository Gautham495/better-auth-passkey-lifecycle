name: 🐛 Bug report
description: Report a reproducible bug or regression in better-auth-passkey-lifecycle.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        👋 Hi!

        **Please fill the following carefully before opening a new issue ❗**
        *(Your issue may be closed if it doesn't provide the required pieces of information)*
  - type: checkboxes
    attributes:
      label: Before submitting a new issue
      description: Please perform simple checks first.
      options:
        - label: I tested using the latest version of the library, as the bug might be already fixed.
          required: true
        - label: I checked that my browser actually supports the Signal API (Chromium 132+ or Safari 26+ — Firefox is not supported yet).
          required: true
        - label: I checked for possible duplicate issues, with possible answers.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: |
        Clear and concise description of what the bug is.
        Screenshots, console output, and network traces are welcome.
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: What version of `better-auth-passkey-lifecycle` are you using?
      placeholder: "x.x.x"
    validations:
      required: true
  - type: input
    id: better-auth-version
    attributes:
      label: better-auth version
      description: Which version of `better-auth` and `@better-auth/passkey` are you on?
      placeholder: "better-auth 1.x.x, @better-auth/passkey 1.x.x"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: Include exact version. iOS 26 has known Signal API bugs — please mention if you're on it.
      placeholder: "Chrome 138 on macOS 14.5 / Safari 26.0.1 on iOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: which-signal
    attributes:
      label: Which helper is affected
      multiple: true
      options:
        - signalUnknownCredential
        - signalAllAcceptedCredentials
        - signalCurrentUserDetails
        - syncAcceptedCredentials
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Clear list of steps and code. What did you call, with what arguments, and what happened?
      value: |
        1. …
        2. …

        ```ts
        // your call
        ```
    validations:
      required: true
  - type: input
    id: reproducible-example
    attributes:
      label: Reproducible example repository
      description: Link to a repo on GitHub that reproduces the issue.
    validations:
      required: true
